{% extends "base.html" %}

{% block content %}
<h1>Camera</h1>
<p>Face recognition camera module</p>

<section style="max-width:640px; margin:12px auto 0; display:flex; flex-direction:column; align-items:center;">
    <video id="preview" autoplay playsinline muted style="width:100%; max-width:640px; height:360px; background:#000; border-radius:6px; object-fit:cover;"></video>

    <div style="width:100%; max-width:640px; display:flex; gap:8px; align-items:center; margin-top:10px;">
        <input id="roll-number" value="{{ roll_number }}" placeholder="Enter roll number (e.g., CS001)" style="flex:1; padding:8px 10px; border-radius:6px; border:1px solid #ddd;" />
        <button id="start-camera" style="padding:8px 12px; border-radius:6px; border:1px solid #0366d6; background:#0366d6; color:#fff; cursor:pointer;">Start Camera</button>
        <button id="stop-camera" style="padding:8px 12px; border-radius:6px; border:1px solid #d73a49; background:#fff; color:#d73a49; cursor:pointer;" disabled>Stop Camera</button>
        <button id="mark-attendance" style="padding:8px 12px; border-radius:6px; border:1px solid #28a745; background:#28a745; color:#fff; cursor:pointer;" disabled>Mark Attendance</button>
    </div>

    <div id="status" style="margin-top:10px; color:#0366d6; font-size:14px;">Idle</div>
</section>

<script>
(function(){
    const startBtn = document.getElementById('start-camera');
    const stopBtn = document.getElementById('stop-camera');
    const markBtn = document.getElementById('mark-attendance');
    const video = document.getElementById('preview');
    const status = document.getElementById('status');
    const rollInput = document.getElementById('roll-number');
    let stream = null;
    let cameraActive = false;

    function setStatus(msg, isError = false){
        status.textContent = msg;
        status.style.color = isError ? '#d73a49' : '#0366d6';
    }

    async function startCamera(){
        try{
            setStatus('Requesting camera...');
            stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
            video.srcObject = stream;
            cameraActive = true;
            stopBtn.disabled = false;
            startBtn.disabled = true;
            // enable mark button only if roll number present
            markBtn.disabled = !rollInput.value.trim();
            setStatus('Camera started — Scanning face...');
        } catch (err) {
            console.error('Camera error', err);
            // Handle permission denied explicitly
            if (err && (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError')){
                setStatus('Camera permission denied. Please allow camera access in your browser.', true);
            } else {
                setStatus('Unable to access camera', true);
            }
        }
    }

    function stopCamera(){
        if (stream){
            stream.getTracks().forEach(t => t.stop());
            video.srcObject = null;
            stream = null;
        }
        cameraActive = false;
        markBtn.disabled = true;
        stopBtn.disabled = true;
        startBtn.disabled = false;
        setStatus('Camera stopped');
    }

    rollInput.addEventListener('input', () => {
        if (cameraActive) {
            markBtn.disabled = !rollInput.value.trim();
        }
    });

    async function markAttendance(){
        const roll = rollInput.value.trim();
        if (!roll){
            setStatus('Please enter roll number', true);
            return;
        }
        setStatus('Marking attendance...');
        markBtn.disabled = true;
        try{
            const resp = await fetch('/attendance/api/mark/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ roll_number: roll }),
            });
            let data = null;
            try { data = await resp.json(); } catch(e) { /* ignore */ }

            if (!resp.ok){
                setStatus((data && (data.error || data.status)) || 'Failed to mark attendance', true);
                markBtn.disabled = false;
            } else {
                if (data && data.status === 'attendance marked'){
                    setStatus('Attendance Marked' + (data.subject ? ' — ' + data.subject : ''));
                    // disable to avoid duplicate marking
                    markBtn.disabled = true;
                } else {
                    setStatus((data && data.status) || 'Attendance response received');
                    markBtn.disabled = false;
                }
            }
        } catch (err) {
            console.error('Attendance API error', err);
            setStatus('Network error while marking attendance', true);
            markBtn.disabled = false;
        }
    }

    startBtn.addEventListener('click', startCamera);
    stopBtn.addEventListener('click', stopCamera);
    markBtn.addEventListener('click', markAttendance);

    // Stop camera when leaving the page
    window.addEventListener('beforeunload', () => {
        stopCamera();
    });
})();
</script>

{% endblock %}
